[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 } # Timeout 3m.
failure-output = "final"

[profile.ci.junit]
path = "junit.xml"

[[profile.ci.overrides]]
filter = 'test(test_merged_engine) | test(transaction::ia) | test(ia_file::test_read)'
retries = 3
