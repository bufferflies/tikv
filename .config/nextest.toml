[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 } # Timeout 5m. Fix `truncate_ts::test_truncate_ts`
failure-output = "final"

[profile.ci.junit]
path = "junit.xml"

[[profile.ci.overrides]]
filter = 'test(transaction::ia) | test(ia_file::test_read) | test(test_native_br::test_backup_pessimistic_lock)'
retries = 3
