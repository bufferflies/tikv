[package]
name = "tikv-server"
version = "0.0.1"
license = "Apache-2.0"
edition = "2018"
publish = false

[features]
default = ["test-engine-kv-rocksdb", "test-engine-raft-raft-engine", "cloud-aws", "cloud-gcp", "cloud-azure"]
tcmalloc = ["tikv/tcmalloc"]
jemalloc = ["tikv/jemalloc"]
mimalloc = ["tikv/mimalloc"]
portable = ["tikv/portable"]
sse = ["tikv/sse"]
mem-profiling = ["tikv/mem-profiling"]
failpoints = ["tikv/failpoints"]
cloud-aws = ["tikv/cloud-aws"]
cloud-gcp = ["tikv/cloud-gcp"]
cloud-azure = ["tikv/cloud-azure"]
test-engine-kv-rocksdb = [
  "tikv/test-engine-kv-rocksdb"
]
test-engine-raft-raft-engine = [
  "tikv/test-engine-raft-raft-engine"
]
test-engines-rocksdb = ["tikv/test-engines-rocksdb"]
test-engines-panic = ["tikv/test-engines-panic"]

pprof-fp = ["tikv/pprof-fp"]

[dependencies]
clap = "2.32"
cloud_server = { path = "../../components/cloud_server", default-features = false }
serde_json = { version = "1.0", features = ["preserve_order"] }
tikv = { workspace = true }
toml = "0.5"

[build-dependencies]
cc = "1.0"
time = "0.1"
