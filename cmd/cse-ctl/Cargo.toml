[package]
name = "cse-ctl"
version = "0.1.0"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
byteorder = "1.2"
bytes = "1.0"
chrono = "0.4"
clap = { version = "3.2", features = ["derive"] }
etcd-client = { git = "https://github.com/pingcap/etcd-client", rev = "14a6f8731f1890d5fd2f6e16a9f0d0a306b0599e", features = ["pub-response-field", "tls-openssl-vendored"] }
futures = "0.3"
grpcio = { version = "0.10", default-features = false, features = ["openssl-vendored", "protobuf-codec"] }
http = "0.2.8"
hyper = "0.14"
kvengine = { path = "../../components/kvengine" }
kvenginepb = { path = "../../components/kvenginepb" }
kvproto = { git = "https://github.com/pingcap/kvproto.git" }
pd_client = { path = "../../components/pd_client", default-features = false }
protobuf = "2.8"
rfengine = { path = "../../components/rfengine" }
rfenginepb = { path = "../../components/rfenginepb" }
security = { path = "../../components/security", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_ignored = "0.1"
serde_json = "1.0"
slog = { version = "2.3", features = ["max_level_trace", "release_max_level_debug"] }
slog-global = { version = "0.1", git = "https://github.com/breeswish/slog-global.git", rev = "d592f88e4dbba5eb439998463054f1a44fbf17b9" }
slog-term = "2.4"
thiserror = "1.0"
tikv-client = { version = "0.1.0", git = "http://github.com/tikv/client-rust.git", rev = "a04e5510a726102d8e1a6b4b029c6e215fd46aa8", default-features = false, features = ["protobuf-codec"] }
tikv_util = { path = "../../components/tikv_util", default-features = false }
tokio = { version = "1.12", features = ["full"] }
toml = "0.5"

[[bin]]
name = "cse-ctl"
path = "src/main.rs"

[lib]
name = "cse_ctl"
path = "src/lib.rs"
