name: CD

on:
  push:
    tags:
      - 'v*'
  schedule:
    # Beijing Time 01:00 (UTC+8) daily
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      update_daily_run_image:
        description: "update daily-run image"
        type: boolean
        default: false
      daily_run_image_tag:
        description: "daily-run image tag"
        type: string
        default: "v8.5.3"

concurrency:
  group: cd-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Decide whether to run scheduled CD based on the existence of artifact.
  check-update:
    name: Check existing artifact
    runs-on: [amd64, cd]
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: hub.pingcap.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Decide whether to run (skip if artifact exists)
        id: decide
        run: |
          set -euo pipefail

          # Non-scheduled events always run.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Non-scheduled events always run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IMAGE_TAG="hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}"
          
          if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Image $IMAGE_TAG exists. Skipping build."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE_TAG does not exist. Running build."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build-arm64:
    name: Build ARM64 Image
    runs-on: arm64
    timeout-minutes: 120
    needs: [check-update]
    if: ${{ github.event_name != 'schedule' || needs.check-update.outputs.run == 'true' }}
    steps:
      - name: Check out Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACTION_BOT }}
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: hub.pingcap.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Build Image Harbor
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/arm64"
          push: true
          # To disable the unnecessary git pull
          context: .
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-arm64
  build-amd64:
    name: Build AMD64 Image
    runs-on: [amd64, cd]
    timeout-minutes: 120
    needs: [check-update]
    if: ${{ github.event_name != 'schedule' || needs.check-update.outputs.run == 'true' }}
    steps:
      - name: Check out Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_ACTION_BOT }}
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: hub.pingcap.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Build Image Harbor
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/amd64"
          push: true
          # To disable the unnecessary git pull
          context: .
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-amd64
  multi-arch:
    name: Create Multi-Architecture Image
    runs-on: [amd64, cd]
    needs: ["build-arm64", "build-amd64"]
    env:
      DAILY_RUN_IMAGE_TAG: ${{ inputs.daily_run_image_tag || 'v8.5.3' }}
    steps:
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: hub.pingcap.net
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: create-manifest-harbor
        run: |
          docker manifest create hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }} \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-amd64 \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-arm64
      - name: push-manifest-harbor
        run: |
          docker manifest push hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}
      - name: Login to Harbor (keyspace)
        if: ${{ inputs.update_daily_run_image || github.ref == 'refs/heads/cloud-engine' || startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v3
        with:
          registry: hub.pingcap.net
          username: "robot$keyspace+cdbot"
          password: ${{ secrets.HARBOR_KEYSPACE_TOKEN }}
      - name: set-additional-tags
        if: ${{ inputs.update_daily_run_image || github.ref == 'refs/heads/cloud-engine' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail

          # If triggered by a push tag, use the tag name; otherwise use DAILY_RUN_IMAGE_TAG.
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          else
            TARGET_TAG="${DAILY_RUN_IMAGE_TAG}"
          fi

          echo "Using target tag: ${TARGET_TAG}"

          # Remove the local manifest entry if it exists
          docker manifest rm hub.pingcap.net/keyspace/tikv-cse:${TARGET_TAG} || true
          
          docker manifest create hub.pingcap.net/keyspace/tikv-cse:${TARGET_TAG} \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-amd64 \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-arm64
          
          docker manifest push hub.pingcap.net/keyspace/tikv-cse:${TARGET_TAG}
