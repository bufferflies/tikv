name: CD

on:
  push:
    branches:
      - cloud-engine
  workflow_dispatch:
    inputs:
      update_daily_run_image:
        description: "update daily-run image"
        type: boolean
        default: false

jobs:
  build-arm64:
    name: Build ARM64 Image
    runs-on: arm64
    timeout-minutes: 120
    steps:
      - name: Check out Code
        uses: actions/checkout@v2
      - name: Build Image
        uses: docker/build-push-action@v2
        with:
          platforms: "linux/arm64"
          push: true
          # To disable the unnecessary git pull
          context: .
          tags: |
            xexplorersun/tikv:cse-${{ github.sha }}-arm64
      - name: Build Image Harbor
        uses: docker/build-push-action@v2
        with:
          platforms: "linux/arm64"
          push: true
          # To disable the unnecessary git pull
          context: .
          tags: |
            hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-arm64
  build-amd64:
    name: Build AMD64 Image
    runs-on: amd64
    timeout-minutes: 120
    outputs:
      image: tikv-cse:${{ github.sha }}-amd64
    steps:
      - name: Check out Code
        uses: actions/checkout@v2
      - name: Build Image
        uses: docker/build-push-action@v2
        with:
          platforms: "linux/amd64"
          push: true
          # To disable the unnecessary git pull
          context: .
          tags: |
            xexplorersun/tikv:cse-${{ github.sha }}-amd64
      - name: Build Image Harbor
        uses: docker/build-push-action@v2
        with:
          platforms: "linux/amd64"
          push: true
          # To disable the unnecessary git pull
          context: .
          tags: |
            hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-amd64
  multi-arch:
    name: Create Multi-Architecture Image
    runs-on: amd64
    needs: ["build-arm64", "build-amd64"]
    steps:
      - name: create-manifest
        run: |
          docker manifest create xexplorersun/tikv:cse-${{ github.sha }} \
          --amend xexplorersun/tikv:cse-${{ github.sha }}-amd64 \
          --amend xexplorersun/tikv:cse-${{ github.sha }}-arm64
      - name: push-manifest
        run: |
          docker manifest push xexplorersun/tikv:cse-${{ github.sha }}
      - name: create-manifest-harbor
        run: |
          docker manifest create hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }} \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-amd64 \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-arm64
      - name: push-manifest-harbor
        run: |
          docker manifest push hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}
      - name: set-additional-tags
        if: ${{ inputs.update_daily_run_image || github.ref == 'refs/heads/cloud-engine' }}
        run: |
          # Remove the local manifest entry if it exists
          docker manifest rm hub.pingcap.net/keyspace/tikv-cse:v6.6.0 || true
          
          docker manifest create hub.pingcap.net/keyspace/tikv-cse:v6.6.0 \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-amd64 \
          --amend hub.pingcap.net/sunxiaoguang/serverless/tikv:${{ github.sha }}-arm64
          
          docker manifest push hub.pingcap.net/keyspace/tikv-cse:v6.6.0
